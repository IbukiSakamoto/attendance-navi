<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>出席ナビ</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div id="loading" class="loading" role="status">読み込み中…</div>

  <main id="app" class="container" hidden>
    <header class="site-header">
      <div class="heading-wrap">
        <p class="eyebrow">ATTENDANCE NAVIGATOR</p>
        <h1>出席ナビ</h1>
        <p id="current-date" class="current-date"></p>
      </div>
      <span class="timezone-label">日本時間</span>
    </header>

    <section aria-labelledby="today-heading" class="today-section">
      <div class="section-heading">
        <h2 id="today-heading">今日の講義</h2>
        <span id="course-count" class="course-count" aria-label="本日の講義数"></span>
      </div>
      <div id="course-list" class="course-list" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <p>出席登録はリンク先の大学システムで行ってください。</p>
      <p>学内ネットワークへの接続が必要な場合があります。</p>
    </footer>
  </main>

  <main id="desktop-notice" class="device-notice" hidden>
    <div class="device-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="13" y="6" width="22" height="36" rx="5" stroke="currentColor" stroke-width="2.6"/>
        <path d="M21 36h6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>出席ナビ</h1>
    <p>スマートフォンまたはタブレットから<br class="desktop-break">アクセスしてください。</p>
    <span class="notice-caption">このページはモバイル端末向けです。</span>
  </main>

  <noscript>
    <div class="noscript-notice">このページの表示にはJavaScriptが必要です。ブラウザの設定を確認してください。</div>
  </noscript>
</body>
</html>
